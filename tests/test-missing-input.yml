name: Test missing input file error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          input_file: /github/workspace/nonexistent_input.pdf
          output_file: /github/workspace/output.pdf
        continue-on-error: true

      - name: Assert action failed due to missing input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when input file does not exist, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when input file was missing"
