name: Test OCR PDF with missing input file
on:
  workflow_dispatch:

jobs:
  test-missing-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent input file (expect failure)
        id: ocr-action
        uses: .
        with:
          input_file: nonexistent_file.pdf
          output_file: output_missing.pdf
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.ocr-action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when input file does not exist, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when input file was missing"
